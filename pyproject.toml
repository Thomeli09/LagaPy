[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lagapy"
version = "0.1.0.dev0"
description = "Python toolkit for preparing, running and analysing Lagamine finite element simulations"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Eliott Thommes" }]
keywords = ["lagamine", "finite element method", "FEM", "geotechnics", "metal forming"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Thomeli09/lagapy"

[project.optional-dependencies]
plot = ["matplotlib>=3.10"]
dev = [
  "build>=1.2",
  "mypy>=1.18",
  "pytest>=9",
  "pytest-cov>=6",
  "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lagapy*"]

[tool.setuptools.package-data]
lagapy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: exercises file-level or end-to-end behaviour",
  "lagamine: requires an external Lagamine installation (opt-in)",
]

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.15"
files = ["src/lagapy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["lagapy"]
branch = true
